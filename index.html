<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator Unlock Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Calculator Frame -->
  <div id="calculator">
    <div id="display">
      <input type="text" id="calc-output" readonly placeholder="Ready…">
    </div>

    <!-- Calculator keys -->
    <div class="keys">
      <!-- Numbers -->
      <button class="num">7</button>
      <button class="num">8</button>
      <button class="num">9</button>
      <button class="op">/</button>

      <button class="num">4</button>
      <button class="num">5</button>
      <button class="num">6</button>
      <button class="op">*</button>

      <button class="num">1</button>
      <button class="num">2</button>
      <button class="num">3</button>
      <button class="op">-</button>

      <button class="num">0</button>
      <button class="del">DEL</button>
      <button class="eq">=</button>
      <button class="op">+</button>

      <!-- Special “CD” button -->
      <button id="cd-btn" class="special">CD</button>
    </div>
  </div>

  <!-- Game list (hidden until unlocked) -->
  <div id="games" class="hidden">
    <h2>Available Games</h2>
    <ul id="game-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
